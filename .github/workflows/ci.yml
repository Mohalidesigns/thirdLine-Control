name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # composer.lock is resolved on PHP 8.4 (Symfony 8.x requires >=8.4.1)
          # — pinning lower makes composer install fail before a single test.
          php-version: '8.4'
          extensions: mbstring, gd, zip, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # The runner has no .env, so nothing supplies APP_KEY — and every test
      # touching encryption (sessions, encrypted credentials) dies with
      # MissingAppKeyException. phpunit.xml still wins for the vars it sets
      # (sqlite :memory:, array drivers); the .env only fills the gaps.
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Lint (Pint)
        run: composer lint

      # Dependency vulnerability scan (16.3) — a known-vulnerable pin fails
      # the build, PHP and JS alike.
      - name: Composer audit
        run: composer audit --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Build assets
        run: npm run build

      - name: Tests
        run: composer test
