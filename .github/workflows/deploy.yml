name: Deploy to Server

# Gated on CI: a push to main no longer deploys directly — the deploy fires
# only after the CI workflow on that same commit completes successfully, so
# a red suite can never reach control-prod. workflow_dispatch remains as the
# manual escape hatch (it skips the gate deliberately — break-glass only).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Avoid overlapping deploys; let the latest push win.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (self-hosted)
    # Deploy only when CI on main succeeded (or on an explicit manual run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # Pinned to this server's runner via its unique label.
    runs-on: [self-hosted, control]
    steps:
      - name: Run deploy script
        run: /usr/local/bin/control-deploy main

      # Reference data lives in idempotent seeders, never in migrations
      # (syncPermissions() wipes migration-time grants), so a deploy that
      # only migrates leaves new feature flags, permissions and seeded
      # taxonomies missing — which is exactly how CR2-A shipped dark.
      # These four are safe to re-run on every deploy.
      - name: Seed reference data (idempotent)
        run: |
          cd /var/www/control
          /usr/bin/php artisan db:seed --class=RolePermissionSeeder --force
          /usr/bin/php artisan db:seed --class=FeatureFlagSeeder --force
          /usr/bin/php artisan db:seed --class=NotificationEventSeeder --force
          /usr/bin/php artisan db:seed --class=ControlStructureSeeder --force
          /usr/bin/php artisan permission:cache-reset
          chown -R www-data:www-data storage bootstrap/cache
