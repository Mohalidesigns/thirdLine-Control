openapi: 3.1.0
info:
  title: SecondLine Integration API
  description: >
    The SecondLine (Atheris Control Solution) side of the ThirdLine / NexusRisk
    integration contract (BRD §8). A control is defined once and consumed
    everywhere: control definitions, test results with effectiveness ratings,
    and open exceptions are published so internal audit can place reliance on
    second-line testing. All endpoints are scoped to the tenant that owns the
    presented API key. Writes require an Idempotency-Key header; repeated
    delivery of the same key is acknowledged without reprocessing.
  version: 1.0.0
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: secondline.client.example
security:
  - ApiKeyAuth: []
paths:
  /controls:
    get:
      summary: Pull control definitions changed since a timestamp
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { type: string, enum: [Draft, Pending Approval, Active, Under Review, Retired] }
      responses:
        '200':
          description: Control definitions with sync envelope fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ControlEnvelope' }
    post:
      summary: Upsert a control definition originated in ThirdLine
      description: >
        Enabled only when the tenant's sync direction is Pull or Bidirectional.
        Matching is by external_ref within the authenticated tenant. Conflicts
        resolve by the configured rule (default last_approved_at wins).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlEnvelope' }
      responses:
        '201':
          description: Created, updated, or skipped (local newer)
        '200':
          description: Duplicate delivery acknowledged (idempotent)
        '409':
          description: Tenant is configured SecondLine-master; inbound writes disabled
  /test-results:
    get:
      summary: Pull published test results with effectiveness ratings
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Published ratings per control test
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TestResult' }
  /exceptions:
    get:
      summary: Pull exceptions for audit reliance
      parameters:
        - name: status
          in: query
          schema: { type: string, default: open }
      responses:
        '200':
          description: Exceptions with severity, age, and status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExceptionSummary' }
  /frameworks/coverage:
    get:
      summary: Framework coverage headline per framework
      description: >
        Share of each framework's testable requirements covered by an approved
        control mapping, and the share where the mapped control also carries a
        current effective rating. Unapproved mappings and retired controls are
        excluded. Global frameworks plus any the tenant owns.
      parameters:
        - name: jurisdiction
          in: query
          description: ISO-3166 alpha-2 code, or INTL
          schema: { type: string }
      responses:
        '200':
          description: Coverage per framework
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FrameworkCoverage' }
  /obligations/instances:
    get:
      summary: Pull the regulatory filing calendar
      description: >
        Generated obligation instances for the tenant, oldest deadline first.
        Every row carries the source obligation's verification_status: a value
        other than "verified" means the underlying dates and penalties have not
        been confirmed against the regulator's primary document and the record
        must not be treated as filing-ready.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema:
            type: string
            enum: [Not Started, In Progress, Submitted, Accepted, Rejected, Overdue, Waived]
        - name: due_before
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Obligation instances with live penalty exposure
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ObligationInstance' }

  # ── Internal-audit interlock (Phase 17.5) ───────────────────────────
  # Third line and second line each hold half the assurance picture. These
  # endpoints exchange coverage, reliance decisions and audit findings.
  # An inbound activity never creates an assurance provider: the provider
  # must already be registered in SecondLine, so an integration key cannot
  # manufacture board-level comfort out of nothing.
  /assurance/coverage:
    get:
      summary: Pull second-line assurance coverage third line can rely on
      description: >
        Every recorded assurance activity for the tenant, with the reliance
        decision, its rationale and the named person who made it. `is_stale`
        is true where the activity has passed its own next-assurance date —
        coverage that exists on paper but should not be relied on.
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: period
          in: query
          schema: { type: string, example: FY2026 }
      responses:
        '200':
          description: Assurance activities, most recently updated first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssuranceActivity' }

  /assurance/gaps:
    get:
      summary: Pull significant risks carrying no live independent assurance
      description: >
        The gaps and duplication the combined assurance map identifies. What
        counts as "significant" and how many providers count as duplication
        are tenant configuration, returned in `meta` so a consumer can see
        the thresholds the answer was computed against.
      parameters:
        - name: period
          in: query
          schema: { type: string, example: FY2026 }
      responses:
        '200':
          description: Assurance gaps with the duplication list and thresholds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssuranceGap' }
                  meta:
                    type: object
                    properties:
                      duplication:
                        type: array
                        items: { $ref: '#/components/schemas/AssuranceDuplication' }
                      significant_bands:
                        type: array
                        items: { type: string }
                      duplication_threshold: { type: integer }

  /assurance/activities:
    post:
      summary: Publish assurance coverage and a reliance decision
      description: >
        Upserts on (provider, subject, period). The named provider must
        already exist in the SecondLine register — an unknown `provider_code`
        is a 422, never an implicit create. The record lands with
        `source: integration` so the map can always show where a cell came
        from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_code, subject_type]
              properties:
                provider_code: { type: string, example: THIRDLINE-IA }
                subject_type: { type: string, enum: [risk, control, obligation, process] }
                subject_ref:
                  type: string
                  description: Business key of the subject (risk code, control_ref, obligation_ref). Required unless subject_id is given.
                subject_id: { type: integer }
                activity_name: { type: string }
                coverage_level: { type: string, enum: [none, partial, full] }
                assurance_type:
                  type: string
                  enum: [reasonable, limited, agreed_upon_procedures, review, inspection, self_assessment]
                period_label: { type: string, example: FY2026 }
                last_assurance_date: { type: string, format: date }
                next_assurance_date: { type: string, format: date }
                conclusion:
                  type: string
                  enum: [satisfactory, needs_improvement, unsatisfactory, not_concluded]
                reliance_level: { type: string, enum: [none, limited, moderate, full] }
                reliance_rationale: { type: string }
                scope_note: { type: string }
                external_ref: { type: string, example: TL-ENG-2026-014 }
      responses:
        '201':
          description: Activity created or updated
        '422':
          description: Unknown provider code, subject type or subject reference

  /assurance/findings:
    post:
      summary: Push an internal-audit finding into the exception register
      description: >
        The finding becomes a control exception with `source_type: Internal
        Audit`, entering the same lifecycle as an exception raised by a
        failed test rather than a parallel one. Re-posting the same
        `external_ref` updates the existing exception, so a retry from the
        audit system never doubles the exception count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_ref, title, severity]
              properties:
                external_ref: { type: string, example: TL-FND-2026-003 }
                title: { type: string }
                description: { type: string }
                severity: { type: string, enum: [Critical, High, Medium, Low] }
                control_ref: { type: string, nullable: true }
                risk_code: { type: string, nullable: true }
                target_closure_date: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Exception created
        '200':
          description: Existing exception updated

  /third-parties:
    get:
      summary: Pull the third-party register with its due-diligence position
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: criticality
          in: query
          schema: { type: string, enum: [Critical, High, Medium, Low] }
      responses:
        '200':
          description: Third parties with their current approved or expired assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ThirdParty' }

  # ── Omnichannel webhooks (Phase 15) ─────────────────────────────────
  # These live on the web root (not /api/v1) and authenticate per channel:
  # Meta signs WhatsApp payloads (X-Hub-Signature-256 over the raw body,
  # HMAC-SHA256 with the app secret); the SMS aggregator and USSD gateway
  # present a shared token. Outbound message content is architecturally
  # limited to a notification and a platform link — never personal data or
  # case content.
  /webhooks/whatsapp:
    servers:
      - url: https://{host}
        variables:
          host:
            default: secondline.client.example
    get:
      summary: Meta webhook verification handshake
      security: []
      parameters:
        - name: hub.mode
          in: query
          schema: { type: string }
        - name: hub.verify_token
          in: query
          schema: { type: string }
        - name: hub.challenge
          in: query
          schema: { type: string }
      responses:
        '200': { description: Echoes hub.challenge when the verify token matches }
        '403': { description: Token mismatch }
    post:
      summary: WhatsApp Cloud API events (statuses + inbound messages)
      description: >
        Signature-verified. Delivery statuses update the message log. An
        inbound message opening with the tenant's Speak-Up keyword passes
        through the anonymising bridge: the case persists with no reporter
        identifier in any form (NCCG RP 19, CBN whistleblowing guidance).
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: { type: string }
      responses:
        '200': { description: Acknowledged }
        '403': { description: Missing or invalid signature }
  /webhooks/sms/receipts:
    servers:
      - url: https://{host}
        variables:
          host:
            default: secondline.client.example
    post:
      summary: SMS delivery receipt (normalised aggregator callback)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, status]
              properties:
                message_id: { type: string }
                status: { type: string, enum: [delivered, failed] }
                cost_minor: { type: integer, minimum: 0 }
                cost_currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '200': { description: Receipt applied }
        '403': { description: Missing or invalid token }
  /webhooks/ussd:
    servers:
      - url: https://{host}
        variables:
          host:
            default: secondline.client.example
    post:
      summary: USSD attestation menu (Africa's Talking conventions)
      description: >
        Behind the `ussd` feature flag AND a gateway token. Only attestation
        signing is reachable from this channel; approvals and SoD-gated
        transitions are not.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                phoneNumber: { type: string }
                text: { type: string }
      responses:
        '200':
          description: Plain-text CON/END menu response
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Envelope:
      type: object
      required: [tenant_id, external_ref, source_system]
      properties:
        tenant_id: { type: integer }
        external_ref: { type: string }
        source_system: { type: string, enum: [SecondLine, ThirdLine, NexusRisk] }
        version_no: { type: integer }
        last_approved_at: { type: string, format: date-time, nullable: true }
    ControlEnvelope:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          required: [control]
          properties:
            control:
              type: object
              required: [title]
              properties:
                control_ref: { type: string }
                title: { type: string }
                description: { type: string, nullable: true }
                objective: { type: string, nullable: true }
                type: { type: string, enum: [Preventive, Detective, Corrective] }
                nature: { type: string, enum: [Manual, Automated, Hybrid, IT-Dependent Manual] }
                frequency: { type: string, enum: [Daily, Weekly, Monthly, Quarterly, Semi-annual, Annual, Event-driven] }
                is_key_control: { type: boolean }
                status: { type: string }
    TestResult:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties:
            reference: { type: string }
            period_label: { type: string }
            design_effectiveness: { type: string, enum: [Effective, Partially Effective, Ineffective, Not Tested] }
            operating_effectiveness: { type: string, enum: [Effective, Partially Effective, Ineffective, Not Tested] }
            overall_rating: { type: string, enum: [Effective, Partially Effective, Ineffective, Not Tested] }
            approved_at: { type: string, format: date-time }
    ExceptionSummary:
      allOf:
        - { $ref: '#/components/schemas/Envelope' }
        - type: object
          properties:
            reference: { type: string }
            title: { type: string }
            severity: { type: string, enum: [Critical, High, Medium, Low] }
            status: { type: string }
            age_days: { type: integer }
            is_overdue: { type: boolean }
            date_raised: { type: string, format: date }
    Money:
      type: object
      description: Integer minor units plus an ISO-4217 code — never a float.
      properties:
        amount: { type: integer, description: Minor units, e.g. kobo }
        currency: { type: string, enum: [NGN, GHS, KES, ZAR, USD, EUR, GBP] }
        formatted: { type: string, example: '₦1,000,000.00' }
    FrameworkCoverage:
      type: object
      properties:
        framework_id: { type: integer }
        code: { type: string, example: COSO-IC-2013 }
        name: { type: string }
        testable_requirements: { type: integer }
        mapped_requirements: { type: integer, description: At least one approved mapping to an active control }
        effective_requirements: { type: integer, description: Mapped control also carries a current effective rating }
        unmapped_requirements: { type: integer }
        mapped_percentage: { type: integer }
        effective_percentage: { type: integer }
        verification_status: { type: string, enum: [verified, unverified, draft] }
    ObligationInstance:
      type: object
      properties:
        id: { type: integer }
        obligation_ref: { type: string, example: CBN-CG-2023-BOARD-EVAL }
        title: { type: string }
        regulator: { type: string, example: CBN }
        entity: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        period_label: { type: string, example: FY2026 }
        due_at: { type: string, format: date-time }
        status:
          type: string
          enum: [Not Started, In Progress, Submitted, Accepted, Rejected, Overdue, Waived]
        days_overdue: { type: integer }
        submission_reference: { type: string, nullable: true }
        penalty_exposure:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        verification_status:
          type: string
          enum: [verified, unverified, draft]
          description: Only "verified" records may enter a generated regulatory submission.
    AssuranceActivity:
      type: object
      description: One cell of the combined assurance map — a provider's coverage of a subject.
      properties:
        id: { type: integer }
        provider_code: { type: string, example: IA }
        provider_name: { type: string }
        provider_line:
          type: string
          enum: [management, second_line, internal_audit, external_audit, regulator, external_assurance]
        subject_type: { type: string, enum: [risk, control, obligation, process] }
        subject_id: { type: integer }
        subject_ref: { type: string, nullable: true, description: Business key of the subject }
        activity_name: { type: string, nullable: true }
        coverage_level: { type: string, enum: [none, partial, full] }
        assurance_type:
          type: string
          enum: [reasonable, limited, agreed_upon_procedures, review, inspection, self_assessment]
        period_label: { type: string, nullable: true }
        last_assurance_date: { type: string, format: date, nullable: true }
        next_assurance_date: { type: string, format: date, nullable: true }
        conclusion:
          type: string
          enum: [satisfactory, needs_improvement, unsatisfactory, not_concluded]
        reliance_level: { type: string, enum: [none, limited, moderate, full] }
        reliance_rationale: { type: string, nullable: true }
        reliance_recorded_by: { type: string, nullable: true, description: The named person who made the reliance decision }
        reliance_recorded_at: { type: string, format: date-time, nullable: true }
        is_stale:
          type: boolean
          description: The activity has passed its own next-assurance date — coverage on paper only.
        source: { type: string, enum: [manual, integration] }
        external_ref: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    AssuranceGap:
      type: object
      description: A significant risk with no live independent assurance.
      properties:
        risk_id: { type: integer }
        code: { type: string, example: RSK-014 }
        title: { type: string }
        band: { type: string, example: High }
        owner: { type: string, nullable: true }
        reason: { type: string, description: Why this counts as a gap — no cover at all, or non-independent or out-of-date cover only. }
    AssuranceDuplication:
      type: object
      description: A subject covered by at least the tenant's duplication threshold of distinct providers.
      properties:
        subject_type: { type: string, enum: [risk, control, obligation, process] }
        subject_label: { type: string }
        subject_id: { type: integer }
        ref: { type: string, nullable: true }
        title: { type: string }
        provider_count: { type: integer }
        providers:
          type: array
          items: { type: string }
        full_coverage_count: { type: integer }
    ThirdParty:
      type: object
      properties:
        reference: { type: string, example: TP-001 }
        legal_name: { type: string }
        category: { type: string, nullable: true }
        criticality: { type: string, enum: [Critical, High, Medium, Low] }
        status: { type: string, enum: [Onboarding, Active, Under Review, Suspended, Exited] }
        jurisdiction: { type: string, example: NG }
        processing_country: { type: string, nullable: true, description: Where the third party actually processes the institution's data }
        entity: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        data_access_classification:
          type: string
          enum: [none, internal, confidential, personal, sensitive_personal]
        annual_spend:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
        regulator_notification_required: { type: boolean }
        regulator_notified_at: { type: string, format: date, nullable: true }
        due_diligence:
          nullable: true
          type: object
          properties:
            reference: { type: string }
            status: { type: string, enum: [Approved, Expired] }
            risk_band: { type: string, nullable: true }
            approved_at: { type: string, format: date-time, nullable: true }
            expires_at: { type: string, format: date, nullable: true }
